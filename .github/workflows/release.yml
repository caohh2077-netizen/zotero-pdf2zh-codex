name: Publish verified Windows package
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - shell: pwsh
        run: |
          $v = python -c "import tomllib; print(tomllib.load(open('compat/upstream.lock.toml','rb'))['release'])"
          if ($env:GITHUB_REF_NAME -ne "v$v") { throw 'Tag does not match release manifest' }
      - name: Verify paired XPI from pinned TypeScript sources
        shell: pwsh
        run: |
          python -X utf8 scripts/build_frontend.py --out "$env:RUNNER_TEMP/rebuilt.xpi"
          if ((Get-FileHash "$env:RUNNER_TEMP/rebuilt.xpi").Hash -ne (Get-FileHash compat/pdf2zh-codex.xpi).Hash) { throw 'XPI reproduction mismatch' }
      - run: ./scripts/Bootstrap-Dev.ps1
      - run: ./scripts/Test.ps1 -Suite Offline
      - run: ./scripts/Test.ps1 -Suite Lifecycle
      - run: python -X utf8 scripts/clean_install.py
      - run: python scripts/build_release.py
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            dist/*.zip
            dist/*.xpi
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem -Path dist -File | Select-Object -ExpandProperty FullName
          gh release create $env:GITHUB_REF_NAME @files --verify-tag --title "Zotero PDF2zh × Codex $env:GITHUB_REF_NAME" --notes-file docs/release.md
