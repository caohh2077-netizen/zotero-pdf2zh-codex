name: Windows acceptance
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - run: ./scripts/Bootstrap-Dev.ps1
      - run: ./scripts/Test.ps1 -Suite Offline
      - run: ./scripts/Test.ps1 -Suite Lifecycle
      - run: python -X utf8 scripts/clean_install.py
